name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: 検証（分割 ${{ matrix.shard }}/3）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.6'
          install_args: ${{ matrix.shard == 1 && 'node python' || 'node' }}
          cache: false
      - name: ブラウザー検証が必要な変更を判定
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: mise exec node -- node scripts/ci-policy.mjs changes >> "$GITHUB_OUTPUT"
      - run: mise run install
        if: ${{ matrix.shard == 1 || steps.changes.outputs.browser == 'true' }}
      - name: 型検査・Oxlint・markdownlint・Oxfmt・単体テスト
        if: ${{ matrix.shard == 1 }}
        run: mise run check:static
      - run: mise run build
        if: ${{ steps.changes.outputs.browser == 'true' }}
      - run: mise run browser:install-ci
        if: ${{ steps.changes.outputs.browser == 'true' }}
      - run: mise run test:browser -- --shard=${{ matrix.shard }}/3
        if: ${{ steps.changes.outputs.browser == 'true' }}
  workflow-result:
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 全検証の成功を確認
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          if [[ "$VERIFY_RESULT" == success ]]; then
            exit 0
          fi
          echo '必要な CI ジョブが成功していません' >&2
          exit 1

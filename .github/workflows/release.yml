name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリース用PRで確定した版（vなし、例: 0.2.0）'
        required: true
        type: string
permissions:
  contents: read
# 異なる版の同時実行でも latest と Release 公開を直列化する。
concurrency:
  group: release-publish
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}
jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      image: ${{ steps.prepare.outputs.image }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.10.7'
          install_args: node
          cache: false
      - name: main CI・版・日本語ノートを確認しタグを作成
        id: prepare
        run: mise run release:prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.plan.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.10.7'
          install_args: node
          cache: false
      - name: 公開済みの版を照合し再利用を判断
        id: plan
        run: mise run release:plan
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.plan.outputs.exists != 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.plan.outputs.exists != 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.plan.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: バージョン固定イメージだけを配布
        id: build
        if: steps.plan.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
  verify:
    name: 配布イメージの匿名検証（${{ matrix.arch }}）
    needs: [prepare, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.10.7'
          install_args: node
          cache: false
      - run: mise run install
      - run: mise run browser:install-ci
      - name: 認証情報のない設定で pull・起動・ブラウザー検証
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          mise run release:verify
          docker pull --platform "$PLATFORM" "$IMAGE@$IMAGE_DIGEST"
          mise run test:docker -- "$IMAGE@$IMAGE_DIGEST" "$PLATFORM"
          mise run release:verify
  finalize:
    needs: [prepare, publish, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.10.7'
          install_args: node
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 検証済み digest を latest に昇格し日本語 Release を公開
        run: mise run release:finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}

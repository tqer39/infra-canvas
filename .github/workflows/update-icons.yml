name: Update icons
on:
  schedule:
    # 毎月1日 09:17 JST（00:17 UTC）。混雑する正時を避ける。
    - cron: '17 0 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '取得と検証だけを行い、更新PRを作成しない'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: update-icons-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INFRA_TEST_PORT: '5183'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.10.12'
          install_args: node python
          cache: false
      - name: 最新版の収集・ブランドカラー適用・出典とハッシュの更新
        run: mise run icons:update
      - name: 更新の有無を確認
        id: collected
        run: |
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '更新なし。取得元・SVG・ハッシュの検証のみ実施し、通常CIと重複する全検証は省略。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - run: mise run install
        if: steps.collected.outputs.changed == 'true'
      - run: mise run fmt
        if: steps.collected.outputs.changed == 'true'
      - name: 型検査・lint・更新処理の回帰テスト・ビルド
        run: mise run check
        if: steps.collected.outputs.changed == 'true'
      - run: mise run browser:install-ci
        if: steps.collected.outputs.changed == 'true'
      - name: 通常画面とオフラインHTMLの表示検証
        run: mise run test:browser -- --workers=1
        if: steps.collected.outputs.changed == 'true'
      - name: 差分の記録
        id: diff
        if: steps.collected.outputs.changed == 'true'
        run: |
          git diff --check
          git diff --stat >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '更新なし' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 1PasswordからApp認証情報を取得
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        id: secrets
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_CLIENT_ID: ${{ secrets.ICON_UPDATER_CLIENT_ID_REFERENCE }}
          APP_PRIVATE_KEY: ${{ secrets.ICON_UPDATER_PRIVATE_KEY_REFERENCE }}
      - name: このリポジトリだけに有効なAppトークンを発行
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.secrets.outputs.APP_CLIENT_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: 更新ブランチとPRを作成・更新
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: mise run icons:publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}

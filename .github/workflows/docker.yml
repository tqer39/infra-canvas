name: Docker
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Docker起動検証（${{ matrix.arch }}）
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: '2026.9.9'
          install_args: node
          cache: false
      - name: Dockerと対象CPUの実行環境を確認
        run: |
          docker info > /dev/null
          docker run --rm --platform linux/${{ matrix.arch }} node:24.21.0-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20 node --version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 検証用イメージをビルド
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: infra-canvas:test-${{ github.run_id }}-${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - run: mise run install
      - run: mise run browser:install-ci
      - name: HTTP・API保護・ブラウザー操作を検証
        run: mise run test:docker -- infra-canvas:test-${{ github.run_id }}-${{ matrix.arch }} linux/${{ matrix.arch }}
      - name: 検証用イメージを削除
        if: ${{ always() }}
        run: docker image rm infra-canvas:test-${{ github.run_id }}-${{ matrix.arch }} || true
